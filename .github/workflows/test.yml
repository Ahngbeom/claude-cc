name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Test
        run: tests/run.sh zsh bash
      - name: Test with /bin/bash 3.2
        if: runner.os == 'macOS'
        run: TEST_BASH=/bin/bash /bin/bash tests/run.sh zsh bash

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning -s bash bin/claude-cc cc.bash tests/run.sh install.sh
